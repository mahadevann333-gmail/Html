<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
</head>
<body>
     <h2>Contact Us</h2>
     
     <form>
     <label for="Name">Name:</label>
     <input type="text" id="Name" placeholder="Enter your Full Name"/><br>
     <label for="Email">Email</label>
     <input type="Email" id="Email" placeholder="Enter your Email"/><br>
     <label for="Phone Number">Phone Number:</label>
     <input type="Tel" id="Phone Number" placeholder="Enter your Phone Number" maxlength="10"/><br>
     <label for="Subject">Subject:</label>
     <input type="text" id="Subject" placeholder="Enter your Subject"><br>
     <label for="Meesage">Meesage:</label>
     <textarea id="Message" rows = "5" cols = "50" name = "description" placeholder="Enter your Meesage"></textarea><br>
     <input type="Submit" value="Submit"/>
     </form>

</body>

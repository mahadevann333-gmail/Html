<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <title>Login page</title>
</head>
<body class="bg-primary">
    <div class="col-12 col-sm-9 mx-auto">
   <div class="card card-white mt-5 p-5">
         <h1 class="pt-3 ml-3"><b>Sign Up</b></h1>
        <p class="text-secondary ml-3">Please fill in this form to create an account!</p><hr>
        <div class="form-group">
            <div class="container-sm">
            <div class="row justify-content-center">
                <div class="col-sm-12 col-md-12 col-lg-12 col-xl-12">
                    <div class="row">
                <div class="col-sm-6 col-md-6 col-lg-6 col-xl-6"><input type="text" name="name" class="form-control-plaintext bg-light p-2" placeholder="First Name"></div>
                <div class="col-sm-6 col-md-6 col-lg-6 col-xl-6"><input type="text" name="name" class="form-control-plaintext bg-light p-2 mt-4 mt-sm-0" placeholder="Last Name"></div>
            </div>
            <div class="row">
                <div class="col-sm-12 col-md-12 col-lg-12 col-xl-12"><input type="email" name="email" class="form-control-plaintext bg-light p-2 mt-4" placeholder=" Email"></div>
                 <div class="col-sm-12 col-md-12 col-lg-12 col-xl-12"><input type="password" name="pwd" class="form-control-plaintext bg-light p-2 mt-4" placeholder="Password"></div>
                 <div class="col-sm-12 col-md-12 col-lg-12 col-xl-12"><input type="email" name="password" class="form-control-plaintext bg-light p-2 mt-4" placeholder="Confirm Password"></div>
            </div>
            </div>
        </div>
        <div class="mt-3 ml-2"><input type="checkbox" class="text-secondary" name="check" required><span class="text-secondary">&nbsp;I accept the <span class="text-primary">Terms Of Use</span>&nbsp;&<span class="text-primary">&nbsp;Privacy Policy</span>.</div>
        </span>
        <div class=" mt-4 ml-2">
            <button type="button" class="btn btn-primary  btn-lg pr-5 pl-5"><b>Sign Up</b></button>
        </div>
          </div>
          </div>
        </div>
   </div>
    <div class="container-sm text-center mt-3">
        <p class="text-white"><b>Already have an account?</b>&nbsp;<a href="#" class="text-white"><u>Login here</u></a><p>
    </div>


    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</body>
</html>

             <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Bakery Feedback Form</title>
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">

                <div class="card shadow">
                    <div class="card-body p-4">

                        <h2 class="text-center mb-4">Bakery Feedback Form</h2>

                        <form>

                            <!-- Customer Name -->
                            <div class="mb-3">
                                <label for="name" class="form-label">Customer Name</label>
                                <input type="text" class="form-control" id="name" placeholder="Enter your name" required>
                            </div>

                            <!-- Email -->
                            <div class="mb-3">
                                <label for="email" class="form-label">Email Address</label>
                                <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
                            </div>

                            <!-- Feedback -->
                            <div class="mb-3">
                                <label for="feedback" class="form-label">Feedback Message</label>
                                <textarea class="form-control" id="feedback" rows="4" placeholder="Write your feedback here"></textarea>
                            </div>

                            <!-- Preferred Contact Method -->
                            <div class="mb-3">
                                <label class="form-label">Preferred Contact Method</label>

                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="contact" id="contactEmail" value="Email">
                                    <label class="form-check-label" for="contactEmail">
                                        Email
                                    </label>
                                </div>

                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="contact" id="contactPhone" value="Phone">
                                    <label class="form-check-label" for="contactPhone">
                                        Phone
                                    </label>
                                </div>
                            </div>

                            <!-- Satisfaction Level -->
                            <div class="mb-3">
                                <label for="satisfaction" class="form-label">
                                    Satisfaction Level (1–10)
                                </label>
                                <input type="range" class="form-range" id="satisfaction"
                                       min="1" max="10" value="5">
                            </div>

                            <!-- Order Type -->
                            <div class="mb-4">
                                <label for="orderType" class="form-label">Type of Order</label>
                                <select class="form-select" id="orderType">
                                    <option selected>Select your order type</option>
                                    <option value="Cake">Cake</option>
                                    <option value="Cookies">Cookies</option>
                                    <option value="Pastries">Pastries</option>
                                </select>
                            </div>

                            <!-- Submit Button -->
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">
                                    Submit Feedback
                                </button>
                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
</body>
</html>
